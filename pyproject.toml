[project]
name = "subscripz-buster"
version = "2.4.0"
description = "Local recurring-charge hunter for Apple Mail (cadence detection + CLI + MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.172.0",
    "google-auth>=2.40.3",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "mcp[cli]>=1.9.4",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "python-dateutil>=2.9.0.post0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
